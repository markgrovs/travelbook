<ul class="entries h-feed">
{{ range . }}
{{ $location := .Params.location | default .Params.place }}
<li class="h-entry">
<time class="dt-published" datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time>
<div class="entry-list-body">
<a class="entry-list-link u-url u-uid p-name" href="{{ .Permalink }}" aria-label="{{ partial "title.html" . }}"><span>{{ if .Title }}{{ .Title }}{{ else }}{{ $location | default "Journal entry" }}{{ end }}</span><span class="entry-list-arrow" aria-hidden="true">→</span></a>
{{ if and .Title $location }}<span class="list-location p-location">{{ $location }}</span>{{ end }}
</div>
</li>
{{ end }}
</ul>
